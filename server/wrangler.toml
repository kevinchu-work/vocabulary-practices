name = "spelling-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Create the real namespace once you're logged in:
#   wrangler kv namespace create VOCAB
# then paste the returned id below (replaces the placeholder).
[[kv_namespaces]]
binding = "VOCAB"
id = "5ae43fc5871d4396b2d073aaca5dc8ae"

# Non-secret config. Secrets are set separately and never committed:
#   wrangler secret put MW_KEY      (your Merriam-Webster Learner's key)
#   wrangler secret put API_TOKEN   (a long random string the clients send)
[vars]
MW_REF = "learners"
